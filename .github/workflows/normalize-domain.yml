name: Normalize Cunningham canonical domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-domain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace www canonical domain references
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            contact.html
            window-repair-knoxville.html
            glass-replacement-knoxville.html
            projects.html
            robots.txt
            sitemap.xml
          )
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            sed -i 's#https://www\.cunninghamwindowstn\.com#https://cunninghamwindowstn.com#g' "$file"
          done
          if git diff --quiet; then
            echo "No domain references needed changing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Normalize canonical domain to non-www"
          git push
